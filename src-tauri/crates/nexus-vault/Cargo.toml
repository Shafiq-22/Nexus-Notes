[package]
name = "nexus-vault"
version = "0.1.0"
edition = "2021"
description = "Pure, GUI-free vault logic for Nexus Notes: markdown parsing, frontmatter, wikilinks, tags, hashing. Unit-testable in isolation."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
once_cell = "1"
blake3 = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
