[package]
name = "nexus-notes"
version = "0.1.0"
description = "Nexus Notes — local-first knowledge app"
authors = ["Nexus Notes"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "nexus-notes"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
nexus-vault = { path = "crates/nexus-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
notify-debouncer-full = "0.3"
blake3 = "1"
walkdir = "2"
thiserror = "1"
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
members = ["crates/nexus-vault"]
